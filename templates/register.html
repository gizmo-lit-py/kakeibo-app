{% extends "base.html" %}

{% block content %}
  <h2>新規登録</h2>
  <form method="post">
    <div>
        <label>ユーザー名</label><br>
        <input type="text" name="username" required>
    </div>
    <div>
        <label>パスワード</label><br>
        <input type="password" name="password" required>
    </div>

    <button type="submit">登録</button>
  </form>
{% endblock %}
