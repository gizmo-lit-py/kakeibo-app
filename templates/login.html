{% extends "base.html" %}

{% block content %}
<h2>ログイン</h2>

<form method="post">
    <div>
        <label>ユーザー名</label><br>
        <input type="text" name="username" required>
    </div>

    <div>
        <label>パスワード</label>
        <input type="password" name="password" required>
    </div>

    <button type="submit">ログイン</button>
</form>
{% endblock %}
